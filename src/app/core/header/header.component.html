<div class="header">
  <div class="container-lg">
    <div class="d-flex justify-content-between">
      <div class="logo">
        <h2 class="name">Tagore <span class="last-name">Banda</span></h2>
      </div>
      <div class="navbar">
        <ul class="menu-list">
          <li [class]="link" #navLink *ngFor="let link of sections">
            <a [href]="'#' + link" class="link" (click)="updateHeaderActive(link, $event)">{{link}}</a>
          </li>
        </ul>
        <label class="switch" aria-label="Theme toggle">
          <input type="checkbox" id="theme" name="themepicker" data-theme-toggle value="false" aria-label="Toggle theme">
        </label>
        <button class="menu-icon" aria-label="Toggle navigation menu">
          <label for="dropdown">
            <i class='bx bx-menu icon-menu'></i>
            <i class='bx bx-x icon-close'></i>
          </label>
          <input type="checkbox" id="dropdown" />
        </button>
      </div>
    </div>
  </div>
</div>
